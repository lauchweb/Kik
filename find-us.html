<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiksoz | Location</title>

    <meta name="description" content="Explore Kiksoz locations and discover where our retail adventure begins.">

    <meta name="robots" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fffdf7;
            color: #183b66;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            text-align: center;
            padding-top: 55px;
            color: #164f8a;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* Locations */
        .locations {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 110px;
        }

        .location-link {
            color: #164f8a;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .location-link:hover {
            opacity: 0.7;
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #183b66;
        }

        footer a {
            color: #183b66;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .page-title {
                font-size: 2.2rem;
                padding-top: 45px;
            }

            .locations {
                margin-top: 80px;
            }

            footer {
                padding: 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1 class="page-title">Kiksoz</h1>

        <section class="locations">
            <a class="location-link"
               href="https://kiksoz.mu">Mauritius</a>
        </section>

    </main>

    <footer>
        <div>
            Do not change &copy; Kiksoz 2025-2026
        </div>

        <div class="footer-right">
            <a href="terms-of-use.html">Terms</a>
            <span>|</span>
            <a href="https://www.instagram.com/kiksoz_"
               target="_blank"
               rel="noopener noreferrer">Follow</a>
            <span>|</span>
            <a href="mailto:info@kiksoz.com">Contact</a>
        </div>
    </footer>

</body>
</html>
