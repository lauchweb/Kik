<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiksoz Mauritius | Location</title>

    <meta name="description" content="Find Kiksoz Mauritius, including our location, contact details, phone number and opening hours.">

    <meta name="robots" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fffdf7;
            color: #183b66;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            text-align: center;
            padding-top: 55px;
            color: #164f8a;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .page-location {
            text-align: center;
            margin-top: 5px;
            color: #183b66;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Location Information */
        .location-content {
            width: 100%;
            max-width: 760px;
            margin-top: 95px;
            padding: 0 20px 0 38px;
        }

        .location-item {
            margin-bottom: 38px;
        }

        .location-item:last-of-type {
            margin-bottom: 0;
        }

        .location-label {
            color: #164f8a;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .location-value {
            color: #183b66;
            font-size: 1rem;
            line-height: 1.7;
        }

        .location-value a {
            color: #183b66;
            text-decoration: none;
        }

        .location-value a:hover {
            text-decoration: underline;
        }

        /* Back to Home */
        .back-home {
            display: inline-block;
            margin-top: 55px;
            color: #164f8a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .back-home:hover {
            opacity: 0.7;
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #183b66;
        }

        footer a {
            color: #183b66;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .page-title {
                font-size: 2.2rem;
                padding-top: 45px;
            }

            .page-location {
                font-size: 0.9rem;
            }

            .location-content {
                margin-top: 70px;
                padding: 0 20px 0 28px;
            }

            .location-item {
                margin-bottom: 32px;
            }

            .back-home {
                margin-top: 45px;
            }

            footer {
                padding: 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1 class="page-title">Kiksoz</h1>

        <div class="page-location">Mauritius</div>

        <section class="location-content">

            <div class="location-item">
                <div class="location-label">Address</div>
                <div class="location-value">
                    [Your address]
                </div>
            </div>

            <div class="location-item">
                <div class="location-label">Phone</div>
                <div class="location-value">
                    <a href="tel:+230XXXXXXXX">
                        +230 XX XX XX XX
                    </a>
                </div>
            </div>

            <div class="location-item">
                <div class="location-label">Opening Hours</div>
                <div class="location-value">
                    Monday – Friday: [Hours]<br>
                    Saturday: [Hours]<br>
                    Sunday: [Hours]
                </div>
            </div>

            <a class="back-home" href="index.html">← Back to Home</a>

        </section>

    </main>

    <footer>
        <div>
            Do not change &copy; Kiksoz 2025-2026
        </div>

        <div class="footer-right">
            <a href="terms-of-use.html">Terms</a>
            <span>|</span>
            <a href="https://www.instagram.com/kiksoz_"
               target="_blank"
               rel="noopener noreferrer">Follow</a>
            <span>|</span>
            <a href="mailto:info@kiksoz.com">Contact</a>
        </div>
    </footer>

</body>
</html>
